{% extends 'base.html' %}
{% load static %}
{% block content %}
<div class="p-3">
<h2>Moxie Data</h2>
<div class="moxie-window">
  <table class="table">
    <tr><th>Name</th><td>{{object.name}}</td></tr>
    <tr><th>Device ID</th><td>{{object.device_id}}</td></tr>
  </table>
</div>
<br>
<h2>Persistent Data</h2>
<div class="moxie-window">
  <pre class="json-view">{{persist_data}}</pre>
</div>
<br>
<h2>Configuration</h2>
<div class="moxie-window">
  <pre class="json-view">{{active_config}}</pre>
</div>
</div>
{% endblock %}
